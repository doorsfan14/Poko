name: Poko
options:
  bundleIdPrefix: com.teamceleris
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Poko:
    type: application
    platform: iOS
    sources:
      - path: Poko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teamceleris.poko
        PRODUCT_NAME: Poko
        INFOPLIST_KEY_CFBundleDisplayName: Poko
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a profile photo or banner."
        INFOPLIST_KEY_NSCameraUsageDescription: "Poko uses the camera for video calls."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Poko uses the microphone for voice and video calls."
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
